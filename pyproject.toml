[project]
name = "mlr-ex07"
version = "0.1.0"
description = "MLR exercise 7, task 6: a neural network written in NumPy, classifying eight blood-cell types"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    # matplotlib is used only for the two PNG figures. Nothing that computes a
    # forward pass, a gradient or a metric imports it.
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["nn_numpy.py", "download_data.py", "train.py", "make_report.py"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
addopts = "-q"
